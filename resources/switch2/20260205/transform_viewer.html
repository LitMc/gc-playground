<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>変換ビューア — S / S⁻¹ / C / φ</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #f0f2f5; --fg: #333; --h1: #2060a0;
    --tab-bg: #d0d4d8; --tab-fg: #666;
    --tab-active-bg: #e0e4ee; --tab-active-fg: #2060a0;
    --tab-border: #aaa;
    --canvas-border: #bbb; --info-fg: #666;
    --legend-s-input: #222; --legend-s-output: #cc2222;
    --legend-sinv-output: #cc7700;
    --legend-c-output: #22884e;
    --legend-phi-output: #0066aa; --legend-oct125: #a07800;
    --legend-verify-output: #228844;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #1a1a2e; --fg: #e0e0e0; --h1: #a0c4ff;
        --tab-bg: #2a2a3e; --tab-fg: #888;
        --tab-active-bg: #3a3a5e; --tab-active-fg: #a0c4ff;
        --tab-border: #555;
        --canvas-border: #444; --info-fg: #888;
        --legend-s-input: #fff; --legend-s-output: #ff6b6b;
        --legend-sinv-output: #ffaa44;
        --legend-c-output: #6bffaa;
        --legend-phi-output: #6bcaff; --legend-oct125: #ffd700;
        --legend-verify-output: #66dd88;
    }
}
body {
    font-family: monospace;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
}
h1 { font-size: 18px; margin-bottom: 12px; color: var(--h1); }
.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
}
.tabs button {
    font-family: monospace;
    font-size: 14px;
    padding: 6px 20px;
    border: 1px solid var(--tab-border);
    background: var(--tab-bg);
    color: var(--tab-fg);
    cursor: pointer;
    border-radius: 4px 4px 0 0;
}
.tabs button.active {
    background: var(--tab-active-bg);
    color: var(--tab-active-fg);
    border-bottom-color: var(--tab-active-bg);
}
.tab-panel { display: none; flex-direction: column; align-items: center; }
.tab-panel.active { display: flex; }
canvas {
    border: 1px solid var(--canvas-border);
    cursor: crosshair;
}
.info {
    margin-top: 12px;
    font-size: 12px;
    color: var(--info-fg);
}
.legend-input { color: var(--legend-s-input); }
.legend-s-out { color: var(--legend-s-output); }
.legend-c-out { color: var(--legend-c-output); }
.legend-phi-out { color: var(--legend-phi-output); }
.legend-sinv-out { color: var(--legend-sinv-output); }
.legend-verify-out { color: var(--legend-verify-output); }
.legend-oct125 { color: var(--legend-oct125); }
</style>
</head>
<body>
<h1>変換ビューア</h1>
<div class="tabs">
    <button id="tabS" class="active" onclick="switchTab('S')">S</button>

    <button id="tabSinvF" onclick="switchTab('sinvF')">S⁻¹+</button>

function inOctA(cx, cy, a) {
    const h = a * C8;
    return Math.abs(C8*cx + S8*cy) <= h
        && Math.abs(C8*cx - S8*cy) <= h
        && Math.abs(S8*cx + C8*cy) <= h
        && Math.abs(S8*cx - C8*cy) <= h;
}

function g2c(gx, gy) {
    return [gx * PX + PX / 2, (N - 1 - gy) * PX + PX / 2];
}

function dot(c, gx, gy, color, r) {
    const [x, y] = g2c(gx, gy);
    c.fillStyle = color;
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
}

function label(c, gx, gy, text, color) {
    const [x, y] = g2c(gx, gy);
    c.font = '11px monospace';
    c.fillStyle = color;
    const tw = c.measureText(text).width;
    let lx = x + 8, ly = y - 8;
    if (lx + tw > SZ) lx = x - tw - 8;
    if (ly < 12) ly = y + 16;
    c.fillText(text, lx, ly);
}

function drawOctOutline(c, verts, style, width) {
    c.strokeStyle = style;
    c.lineWidth = width;
    c.beginPath();
    const [x0, y0] = g2c(128 + verts[0][0], 128 + verts[0][1]);
    c.moveTo(x0, y0);
    for (let i = 1; i < verts.length; i++) {
        const [x, y] = g2c(128 + verts[i][0], 128 + verts[i][1]);
        c.lineTo(x, y);
    }
    c.closePath();
    c.stroke();
}

function drawCenterLines(c) {
    c.strokeStyle = T.centerLine;
    c.lineWidth = 1;
    const [cx, cy] = g2c(128, 128);
    c.beginPath();
    c.moveTo(cx, 0); c.lineTo(cx, SZ);
    c.moveTo(0, cy); c.lineTo(SZ, cy);
    c.stroke();
}

    label(ctxS, mx, my, `S(s) (${mx}, ${my})`, T.sOutput);
}

cvS.addEventListener('mousemove', (e) => {
    const r = cvS.getBoundingClientRect();
    const sx = Math.floor((e.clientX - r.left) / PX);
    const sy = N - 1 - Math.floor((e.clientY - r.top) / PX);
    if (sx >= 0 && sx < N && sy >= 0 && sy < N) {

// C タブ — Oct(125) への放射クランプ
// ══════════════════════════════════════════
const cvC = document.getElementById('cvC');
const ctxC = cvC.getContext('2d');

const CLAMP_A = 125;
const CLAMP_H = CLAMP_A * C8;

// Oct(a) への放射クランプ: Oct 外の点を中心からの方向を保って境界に射影
function clampOct(sx, sy) {
    const px = sx - 128, py = sy - 128;
    if (px === 0 && py === 0) return [128, 128];
    const t = Math.max(
        Math.abs(C8*px + S8*py) / CLAMP_H,
        Math.abs(C8*px - S8*py) / CLAMP_H,
        Math.abs(S8*px + C8*py) / CLAMP_H,
        Math.abs(S8*px - C8*py) / CLAMP_H
    );
    if (t <= 1) return [sx, sy];
    return [px / t + 128, py / t + 128];
}

let bgC = null;

function initBgC() {
    const img = ctxC.createImageData(SZ, SZ);
    for (let mx = 0; mx < N; mx++)
        for (let my = 0; my < N; my++) {
            const inside = inOctA(mx - 128, my - 128, 125);
            const [r, g, b] = inside ? T.octInside : T.octOutside;
            for (let px = 0; px < PX; px++)
                for (let py = 0; py < PX; py++) {
                    const i = ((N-1-my)*PX+py) * SZ + mx*PX+px;
                    img.data[i*4]=r; img.data[i*4+1]=g;
                    img.data[i*4+2]=b; img.data[i*4+3]=255;
                }
        }
    bgC = img;
}

function drawBgC() {
    ctxC.putImageData(bgC, 0, 0);
    drawCenterLines(ctxC);
    drawOctOutline(ctxC, OCT125_VERTS, T.oct125Line, 1.5);
}

let curC = [-1, -1];

function updateC() {
    drawBgC();
    if (curC[0] < 0) return;
    const [sx, sy] = curC;
    const [cx, cy] = clampOct(sx, sy);

    const [x1, y1] = g2c(sx, sy);
    const [x2, y2] = g2c(cx, cy);
    ctxC.strokeStyle = T.dashLine;
    ctxC.lineWidth = 1;
    ctxC.setLineDash([3, 3]);
    ctxC.beginPath();
    ctxC.moveTo(x1, y1); ctxC.lineTo(x2, y2);
    ctxC.stroke();
    ctxC.setLineDash([]);

    dot(ctxC, sx, sy, T.inputDot, 4);
    label(ctxC, sx, sy, `s (${sx}, ${sy})`, T.inputDot);
    dot(ctxC, cx, cy, T.cOutput, 5);
    label(ctxC, cx, cy, `C(s) (${cx.toFixed(1)}, ${cy.toFixed(1)})`, T.cOutput);
}

cvC.addEventListener('mousemove', (e) => {
    const r = cvC.getBoundingClientRect();
    const sx = Math.floor((e.clientX - r.left) / PX);
    const sy = N - 1 - Math.floor((e.clientY - r.top) / PX);
    if (sx >= 0 && sx < N && sy >= 0 && sy < N) {
        curC = [sx, sy];
        updateC();
    }
});
cvC.addEventListener('mouseleave', () => { curC = [-1, -1]; drawBgC(); });

// φ タブ
// ══════════════════════════════════════════
const cvPhi = document.getElementById('cvPhi');
const ctxPhi = cvPhi.getContext('2d');

const K = 100 / 125;  // = 0.8

let bgPhi = null;

function initBgPhi() {
    const img = ctxPhi.createImageData(SZ, SZ);
    for (let mx = 0; mx < N; mx++)
        for (let my = 0; my < N; my++) {
            const cx = mx - 128, cy = my - 128;
            const in100 = inOctA(cx, cy, 100);
            const in125 = inOctA(cx, cy, 125);
            let rgb;
            if (in100)      rgb = T.octInside;
            else if (in125) rgb = T.oct125Zone;
            else            rgb = T.octOutside;
            const [r, g, b] = rgb;
            for (let px = 0; px < PX; px++)
                for (let py = 0; py < PX; py++) {
                    const i = ((N-1-my)*PX+py) * SZ + mx*PX+px;
                    img.data[i*4]=r; img.data[i*4+1]=g;
                    img.data[i*4+2]=b; img.data[i*4+3]=255;
                }
        }
    bgPhi = img;
}

function drawBgPhi() {
    ctxPhi.putImageData(bgPhi, 0, 0);
    drawCenterLines(ctxPhi);
    drawOctOutline(ctxPhi, OCT100_VERTS, T.oct100Line, 1.5);
    drawOctOutline(ctxPhi, OCT125_VERTS, T.oct125Line, 1.5);
}

function phi(sx, sy) {
    return [K * (sx - 128) + 128, K * (sy - 128) + 128];
}

let curPhi = [-1, -1];

function updatePhi() {
    drawBgPhi();
    if (curPhi[0] < 0) return;
    const [sx, sy] = curPhi;
    const [px, py] = phi(sx, sy);

    const [x1, y1] = g2c(sx, sy);
    const [x2, y2] = g2c(px, py);
    ctxPhi.strokeStyle = T.dashLine;
    ctxPhi.lineWidth = 1;
    ctxPhi.setLineDash([3, 3]);
    ctxPhi.beginPath();
    ctxPhi.moveTo(x1, y1); ctxPhi.lineTo(x2, y2);
    ctxPhi.stroke();
    ctxPhi.setLineDash([]);

    dot(ctxPhi, sx, sy, T.inputDot, 4);
    label(ctxPhi, sx, sy, `s (${sx}, ${sy})`, T.inputDot);
    dot(ctxPhi, px, py, T.phiOutput, 5);
    label(ctxPhi, px, py, `\u03c6(s) (${px.toFixed(1)}, ${py.toFixed(1)})`, T.phiOutput);
}

cvPhi.addEventListener('mousemove', (e) => {
    const r = cvPhi.getBoundingClientRect();
    const sx = Math.floor((e.clientX - r.left) / PX);
    const sy = N - 1 - Math.floor((e.clientY - r.top) / PX);
    if (sx >= 0 && sx < N && sy >= 0 && sy < N) {
        curPhi = [sx, sy];
        updatePhi();
    }
});
cvPhi.addEventListener('mouseleave', () => { curPhi = [-1, -1]; drawBgPhi(); });

// ══════════════════════════════════════════
// S⁻¹ タブ — S の逆引き
// ══════════════════════════════════════════
const cvSinv = document.getElementById('cvSinv');
const ctxSinv = cvSinv.getContext('2d');

// 逆引きテーブル: INV_S[mx][my] = [sx, sy] or null
const INV_S = Array.from({length: N}, () => Array.from({length: N}, () => null));
for (let sx = 0; sx < N; sx++)
    for (let sy = 0; sy < N; sy++) {
        const [mx, my] = S_DATA[sx][sy];
        if (mx >= 0 && mx < N && my >= 0 && my < N)
            INV_S[mx][my] = [sx, sy];
    }

// 最近傍補間で全ギャップを埋めた逆引きテーブル (BFS)
const INV_SF = Array.from({length: N}, (_, i) =>
    Array.from({length: N}, (_, j) => INV_S[i][j]));
const EXACT = Array.from({length: N}, (_, i) =>
    Array.from({length: N}, (_, j) => INV_S[i][j] !== null));
{
    const q = [];
    for (let mx = 0; mx < N; mx++)
        for (let my = 0; my < N; my++)
            if (INV_S[mx][my]) q.push([mx, my]);
    let qi = 0;
    while (qi < q.length) {
        const [mx, my] = q[qi++];
        for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
            const nx = mx + dx, ny = my + dy;
            if (nx >= 0 && nx < N && ny >= 0 && ny < N && !INV_SF[nx][ny]) {
                INV_SF[nx][ny] = INV_SF[mx][my];
                q.push([nx, ny]);
            }
        }
    }
}

let bgSinv = null;

function initBgSinv() {
    const img = ctxSinv.createImageData(SZ, SZ);
    for (let mx = 0; mx < N; mx++)
        for (let my = 0; my < N; my++) {
            const inside = inOctA(mx - 128, my - 128, 100);
            const hasPre = INV_S[mx][my] !== null;
            let rgb;
            if (inside && hasPre)  rgb = T.octInside;
            else if (inside)       rgb = T.sinvGap;
            else                   rgb = T.octOutside;
            const [r, g, b] = rgb;
            for (let px = 0; px < PX; px++)
                for (let py = 0; py < PX; py++) {
                    const i = ((N-1-my)*PX+py) * SZ + mx*PX+px;
                    img.data[i*4]=r; img.data[i*4+1]=g;
                    img.data[i*4+2]=b; img.data[i*4+3]=255;
                }
        }
    bgSinv = img;
}

function drawBgSinv() {
    ctxSinv.putImageData(bgSinv, 0, 0);
    drawCenterLines(ctxSinv);
    drawOctOutline(ctxSinv, OCT100_VERTS, T.oct100Line, 1.5);
}

let curSinv = [-1, -1];

function updateSinv() {
    drawBgSinv();
    if (curSinv[0] < 0) return;
    const [mx, my] = curSinv;
    const pre = INV_S[mx][my];

    dot(ctxSinv, mx, my, T.inputDot, 4);
    label(ctxSinv, mx, my, `m (${mx}, ${my})`, T.inputDot);

    if (pre) {
        const [sx, sy] = pre;
        const [x1, y1] = g2c(mx, my);
        const [x2, y2] = g2c(sx, sy);
        ctxSinv.strokeStyle = T.dashLine;
        ctxSinv.lineWidth = 1;
        ctxSinv.setLineDash([3, 3]);
        ctxSinv.beginPath();
        ctxSinv.moveTo(x1, y1); ctxSinv.lineTo(x2, y2);
        ctxSinv.stroke();
        ctxSinv.setLineDash([]);

        dot(ctxSinv, sx, sy, T.sinvOutput, 5);
        label(ctxSinv, sx, sy, `S\u207b\u00b9(m) (${sx}, ${sy})`, T.sinvOutput);
    } else {
        label(ctxSinv, mx, my + 12, '\u539f\u50cf\u306a\u3057', T.sinvOutput);
    }
}

cvSinv.addEventListener('mousemove', (e) => {
    const r = cvSinv.getBoundingClientRect();
    const mx = Math.floor((e.clientX - r.left) / PX);
    const my = N - 1 - Math.floor((e.clientY - r.top) / PX);
    if (mx >= 0 && mx < N && my >= 0 && my < N) {
        curSinv = [mx, my];
        updateSinv();
    }
});
cvSinv.addEventListener('mouseleave', () => { curSinv = [-1, -1]; drawBgSinv(); });

// ══════════════════════════════════════════
// S⁻¹+ タブ — 最近傍補間付き逆引き
// ══════════════════════════════════════════
const cvSinvF = document.getElementById('cvSinvF');
const ctxSinvF = cvSinvF.getContext('2d');

let bgSinvF = null;

function initBgSinvF() {
    const img = ctxSinvF.createImageData(SZ, SZ);
    for (let mx = 0; mx < N; mx++)
        for (let my = 0; my < N; my++) {
            const inside = inOctA(mx - 128, my - 128, 100);
            const exact = EXACT[mx][my];
            let rgb;
            if (inside && exact)   rgb = T.octInside;
            else if (inside)       rgb = T.sinvGap;
            else                   rgb = T.octOutside;
            const [r, g, b] = rgb;
            for (let px = 0; px < PX; px++)
                for (let py = 0; py < PX; py++) {
                    const i = ((N-1-my)*PX+py) * SZ + mx*PX+px;
                    img.data[i*4]=r; img.data[i*4+1]=g;
                    img.data[i*4+2]=b; img.data[i*4+3]=255;
                }
        }
    bgSinvF = img;
}

function drawBgSinvF() {
    ctxSinvF.putImageData(bgSinvF, 0, 0);
    drawCenterLines(ctxSinvF);
    drawOctOutline(ctxSinvF, OCT100_VERTS, T.oct100Line, 1.5);
}

let curSinvF = [-1, -1];

function updateSinvF() {
    drawBgSinvF();
    if (curSinvF[0] < 0) return;
    const [mx, my] = curSinvF;
    const pre = INV_SF[mx][my];

    dot(ctxSinvF, mx, my, T.inputDot, 4);
    label(ctxSinvF, mx, my, `m (${mx}, ${my})`, T.inputDot);

    if (pre) {
        const [sx, sy] = pre;
        const [x1, y1] = g2c(mx, my);
        const [x2, y2] = g2c(sx, sy);
        ctxSinvF.strokeStyle = T.dashLine;
        ctxSinvF.lineWidth = 1;
        ctxSinvF.setLineDash([3, 3]);
        ctxSinvF.beginPath();
        ctxSinvF.moveTo(x1, y1); ctxSinvF.lineTo(x2, y2);
        ctxSinvF.stroke();
        ctxSinvF.setLineDash([]);

        const suffix = EXACT[mx][my] ? '' : ' (\u88dc\u9593)';
        dot(ctxSinvF, sx, sy, T.sinvOutput, 5);
        label(ctxSinvF, sx, sy, `S\u207b\u00b9(m) (${sx}, ${sy})${suffix}`, T.sinvOutput);
    }
}

cvSinvF.addEventListener('mousemove', (e) => {
    const r = cvSinvF.getBoundingClientRect();
    const mx = Math.floor((e.clientX - r.left) / PX);
    const my = N - 1 - Math.floor((e.clientY - r.top) / PX);
    if (mx >= 0 && mx < N && my >= 0 && my < N) {
        curSinvF = [mx, my];
        updateSinvF();
    }
});
cvSinvF.addEventListener('mouseleave', () => { curSinvF = [-1, -1]; drawBgSinvF(); });

// ══════════════════════════════════════════
// S∘S⁻¹+ タブ — 往復検証（誤差ヒートマップ）
// ══════════════════════════════════════════
const cvVerify = document.getElementById('cvVerify');
const ctxVerify = cvVerify.getContext('2d');

let bgVerify = null;

function initBgVerify() {
    const img = ctxVerify.createImageData(SZ, SZ);
    for (let mx = 0; mx < N; mx++)
        for (let my = 0; my < N; my++) {
            const inside = inOctA(mx - 128, my - 128, 100);
            const pre = INV_SF[mx][my];
            let rgb;
            if (!inside || !pre) {
                rgb = T.octOutside;
            } else {
                const [sx, sy] = pre;
                const [mx2, my2] = S_DATA[sx][sy];
                const err = Math.max(Math.abs(mx2 - mx), Math.abs(my2 - my));
                const t = Math.min(err / 5, 1);
                const gd = T.verifyGood, bd = T.verifyBad;
                rgb = [
                    Math.round(gd[0] + (bd[0] - gd[0]) * t),
                    Math.round(gd[1] + (bd[1] - gd[1]) * t),
                    Math.round(gd[2] + (bd[2] - gd[2]) * t),
                ];
            }
            const [r, g, b] = rgb;
            for (let px = 0; px < PX; px++)
                for (let py = 0; py < PX; py++) {
                    const i = ((N-1-my)*PX+py) * SZ + mx*PX+px;
                    img.data[i*4]=r; img.data[i*4+1]=g;
                    img.data[i*4+2]=b; img.data[i*4+3]=255;
                }
        }
    bgVerify = img;
}

function drawBgVerify() {
    ctxVerify.putImageData(bgVerify, 0, 0);
    drawCenterLines(ctxVerify);
    drawOctOutline(ctxVerify, OCT100_VERTS, T.oct100Line, 1.5);
}

let curVerify = [-1, -1];

function updateVerify() {
    drawBgVerify();
    if (curVerify[0] < 0) return;
    const [mx, my] = curVerify;
    const pre = INV_SF[mx][my];

    dot(ctxVerify, mx, my, T.inputDot, 4);
    label(ctxVerify, mx, my, `m (${mx}, ${my})`, T.inputDot);

    if (pre) {
        const [sx, sy] = pre;
        const [mx2, my2] = S_DATA[sx][sy];
        const err = Math.hypot(mx2 - mx, my2 - my);

        const [x1, y1] = g2c(mx, my);
        const [x2, y2] = g2c(mx2, my2);
        ctxVerify.strokeStyle = T.dashLine;
        ctxVerify.lineWidth = 1;
        ctxVerify.setLineDash([3, 3]);
        ctxVerify.beginPath();
        ctxVerify.moveTo(x1, y1); ctxVerify.lineTo(x2, y2);
        ctxVerify.stroke();
        ctxVerify.setLineDash([]);

        dot(ctxVerify, mx2, my2, T.verifyOutput, 5);
        label(ctxVerify, mx2, my2,
            `S(S\u207b\u00b9\u207a(m)) (${mx2},${my2}) err=${err.toFixed(1)}`,
            T.verifyOutput);
    }
}

cvVerify.addEventListener('mousemove', (e) => {
    const r = cvVerify.getBoundingClientRect();
    const mx = Math.floor((e.clientX - r.left) / PX);
    const my = N - 1 - Math.floor((e.clientY - r.top) / PX);
    if (mx >= 0 && mx < N && my >= 0 && my < N) {
        curVerify = [mx, my];
        updateVerify();
    }
});
cvVerify.addEventListener('mouseleave', () => { curVerify = [-1, -1]; drawBgVerify(); });

// ══════════════════════════════════════════
// タブ切り替え
// ══════════════════════════════════════════
let activeTab = 'S';

const TAB_MAP = {S:'S', sinv:'Sinv', sinvF:'SinvF', verify:'Verify', C:'C', phi:'Phi'};

function switchTab(name) {
    activeTab = name;
    for (const [k, v] of Object.entries(TAB_MAP)) {
        document.getElementById('tab' + v).classList.toggle('active', k === name);
        document.getElementById('panel' + v).classList.toggle('active', k === name);
    }
    if (name === 'S') drawBgS();
    else if (name === 'sinv') drawBgSinv();
    else if (name === 'sinvF') drawBgSinvF();
    else if (name === 'verify') drawBgVerify();
    else if (name === 'C') drawBgC();
    else drawBgPhi();
}

// ══════════════════════════════════════════
// テーマ変更検知
// ══════════════════════════════════════════
mq.addEventListener('change', () => {
    T = mq.matches ? THEMES.dark : THEMES.light;
    initBgS(); initBgSinv(); initBgSinvF(); initBgVerify(); initBgC(); initBgPhi();
    if (activeTab === 'S') updateS();
    else if (activeTab === 'sinv') updateSinv();
    else if (activeTab === 'sinvF') updateSinvF();
    else if (activeTab === 'verify') updateVerify();
    else if (activeTab === 'C') updateC();
    else updatePhi();
});

// 初期化
initBgS();
initBgSinv();
initBgSinvF();
initBgVerify();
initBgC();
initBgPhi();
drawBgS();
</script>
